name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer test

  lowest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        laravel: ['12.*', '13.*']
    name: Lowest dependencies / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
      - run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: composer test

  coverage:
    runs-on: ubuntu-latest
    name: Coverage
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest --coverage --min=80 --coverage-clover=coverage.xml
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
